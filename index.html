<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Installed on iPad / iPhone home screen: open full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Teachly" />
    <meta name="description" content="Teachly — a smooth, feature-rich interactive whiteboard for smart boards and classrooms." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/orbitron.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Teachly</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Opening screen: clean white, no animation, 1.5 s (src/main.ts fades it out). -->
    <div id="splash" aria-label="Teachly by Physica">
      <style>
        @font-face { font-family: 'Orbitron'; src: url('./fonts/orbitron.woff2') format('woff2'); font-weight: 400 900; font-display: block; }
        #splash {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: grid;
          place-items: center;
          background: #fff;
          color: #000;
          font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
          transition: opacity 0.3s ease;
        }
        #splash.hide {
          opacity: 0;
          pointer-events: none;
        }
        #splash .sp-in {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.35em;
        }
        #splash .sp-name {
          font-size: clamp(44px, 9vmin, 120px);
          font-weight: 700;
          letter-spacing: -0.01em;
          line-height: 1;
        }
        #splash .sp-by {
          font-size: clamp(16px, 2.6vmin, 32px);
          font-weight: 400;
        }
        #splash .sp-by span {
          font-family: 'Orbitron', sans-serif;
          font-weight: 700;
          letter-spacing: 0.04em;
        }
      </style>
      <div class="sp-in">
        <div class="sp-name">Teachly</div>
        <div class="sp-by">by <span>Physica</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
