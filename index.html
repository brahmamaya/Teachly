<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Installed on iPad / iPhone home screen: open full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Teachly" />
    <meta name="description" content="Teachly — a smooth, feature-rich interactive whiteboard for smart boards and classrooms." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Teachly by Physica</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Opening screen in the Physica style: shown instantly, faded out by src/main.ts after ~2 s. -->
    <div id="splash" aria-label="Teachly by Physica">
      <style>
        #splash {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: grid;
          place-items: center;
          background: #000;
          color: #fff;
          font-family: 'Exo 2', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          transition: opacity 0.5s ease, filter 0.5s ease;
        }
        #splash.hide {
          opacity: 0;
          filter: blur(6px);
          pointer-events: none;
        }
        #splash .sp-in {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 22px;
        }
        #splash .sp-in > * {
          animation: sp-up 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        #splash .sp-in > :nth-child(2) { animation-delay: 0.12s; }
        #splash .sp-in > :nth-child(3) { animation-delay: 0.3s; }
        #splash .sp-atom {
          width: clamp(84px, 14vmin, 150px);
          height: auto;
          filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.35));
        }
        #splash .sp-orbit {
          transform-origin: 32px 32px;
          animation: sp-spin 6s linear infinite;
        }
        #splash .sp-name {
          font-family: 'Orbitron', 'Exo 2', sans-serif;
          font-weight: 900;
          font-size: clamp(38px, 8vmin, 92px);
          letter-spacing: 0.08em;
          text-transform: uppercase;
          line-height: 1;
          background: linear-gradient(90deg, #fff 0%, #9a9a9a 30%, #fff 50%, #9a9a9a 70%, #fff 100%);
          background-size: 250% 100%;
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          animation: sp-up 0.9s 0.12s cubic-bezier(0.2, 0.8, 0.2, 1) both, sp-shine 4s linear infinite;
          filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.3));
        }
        #splash .sp-by {
          display: flex;
          align-items: center;
          gap: 10px;
          font-size: clamp(14px, 2.2vmin, 22px);
          font-weight: 600;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: #bdbdbd;
        }
        #splash .sp-by b {
          font-family: 'Orbitron', 'Exo 2', sans-serif;
          font-weight: 800;
          letter-spacing: 0.06em;
          text-transform: none;
          color: #fff;
        }
        @keyframes sp-up {
          from { opacity: 0; transform: translateY(18px); filter: blur(4px); }
        }
        @keyframes sp-spin {
          to { transform: rotate(360deg); }
        }
        @keyframes sp-shine {
          from { background-position: 0% 50%; }
          to { background-position: 100% 50%; }
        }
        @media (prefers-reduced-motion: reduce) {
          #splash .sp-in > *, #splash .sp-orbit, #splash .sp-name { animation: none; }
        }
      </style>
      <div class="sp-in">
        <!-- Physica atom mark -->
        <svg class="sp-atom" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.4" aria-hidden="true">
          <circle cx="32" cy="32" r="17" />
          <g class="sp-orbit"><ellipse cx="32" cy="32" rx="25" ry="8.6" transform="rotate(-55 32 32)" /></g>
          <circle cx="32" cy="32" r="3.8" fill="#fff" stroke="none" />
        </svg>
        <div class="sp-name">Teachly</div>
        <div class="sp-by">by <b>physica.</b></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
