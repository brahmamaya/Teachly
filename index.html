<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Installed on iPad / iPhone home screen: open full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Physica Notes" />
    <meta name="description" content="Physica Notes — a smooth, feature-rich interactive whiteboard for smart boards and classrooms." />
    <link rel="icon" href="./favicon.png" type="image/png" />
    <meta property="og:title" content="Physica Notes" />
    <meta property="og:description" content="Smooth interactive whiteboard for teachers." />
    <meta property="og:image" content="./og.png" />
    <link rel="preload" href="./fonts/orbitron.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Physica Notes</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Opening screen: clean white; the name fades in softly, and after 1.5 s it all fades away (src/main.ts). -->
    <div id="splash" aria-label="Physica Notes">
      <style>
        @font-face { font-family: 'Orbitron'; src: url('./fonts/orbitron.woff2') format('woff2'); font-weight: 400 900; font-display: block; }
        #splash {
          position: fixed;
          top: 0;
          right: 0;
          bottom: 0;
          left: 0;
          z-index: 99999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #fff;
          color: #000;
          font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
          transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1);
          will-change: opacity;
        }
        #splash.hide {
          opacity: 0;
          pointer-events: none;
        }
        #splash .sp-in {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.35em;
          animation: sp-in 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
          transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* going away: the name grows a little while everything fades (no sudden cut) */
        #splash.hide .sp-in {
          transform: scale(1.04);
        }
        @keyframes sp-in {
          from {
            opacity: 0;
            transform: translateY(8px) scale(0.98);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #splash,
          #splash .sp-in {
            animation: none;
            transition: opacity 0.2s linear;
          }
          #splash.hide .sp-in {
            transform: none;
          }
        }
        #splash .sp-logo {
          display: block;
          width: clamp(72px, 12vmin, 160px);
          height: auto;
          margin: 0 auto 18px;
          filter: drop-shadow(0 8px 20px rgba(13, 148, 136, 0.35));
        }
        #splash .sp-name {
          font-size: clamp(44px, 9vmin, 120px);
          font-weight: 700;
          letter-spacing: -0.01em;
          line-height: 1;
        }
        #splash .sp-by {
          font-size: clamp(16px, 2.6vmin, 32px);
          font-weight: 400;
        }
        #splash .sp-by span {
          font-family: 'Orbitron', sans-serif;
          font-weight: 700;
          letter-spacing: 0.04em;
        }
      </style>
      <div class="sp-in">
        <img class="sp-logo" src="./icon-192.png" width="96" height="96" alt="" />
        <div class="sp-name">Physica Notes</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
